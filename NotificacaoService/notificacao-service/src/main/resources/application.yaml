spring:
  config:
    import: classpath:kafka-defaults.yaml
  application:
    name: notificacao-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/notificacoes}
    username: ${DB_USER:notificacoes}
    password: ${DB_PASSWORD:notificacoes_local}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
  usuario-local-id: ${USUARIO_LOCAL_ID:11111111-1111-1111-1111-111111111111}
